<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comment DM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/app/icons/icon-192.png">
<title>ig-comment-dm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='2' fill='%2318181B'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('igdm-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#F7F7F8;--surface:#FFFFFF;--sunk:#F4F4F5;--line:#E4E4E7;--line-2:#D4D4D8;
  --ink:#18181B;--ink-2:#52525B;--ink-3:#71717A;--ph:#A1A1AA;
  --accent:#0B6BDE;--on-accent:#fff;--btn:#18181B;--on-btn:#fff;--accent-soft:rgba(11,107,222,.14);
  --ok:#16A34A;--warn:#D97706;--bad:#DC2626;--warn-t:#B45309;--sw-off:#D4D4D8;
  --shadow:0 8px 24px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);--scrim:rgba(9,9,11,.32);
  --ph-bg:#fff;--ph-bubble:#EFEFEF;--ph-text:#000;--ph-mute:#737373;--ph-link:#00376B;--frame:#E4E4E7;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#09090B;--surface:#121214;--sunk:#1F1F23;--line:#27272A;--line-2:#3F3F46;
  --ink:#FAFAFA;--ink-2:#A1A1AA;--ink-3:#8A8A94;--ph:#71717A;
  --accent:#3B8EF5;--on-accent:#0B0B0D;--btn:#FAFAFA;--on-btn:#09090B;--accent-soft:rgba(59,142,245,.22);
  --ok:#22C55E;--warn:#F59E0B;--bad:#EF4444;--warn-t:#F59E0B;--sw-off:#3F3F46;
  --shadow:0 8px 24px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);
  --ph-bg:#000;--ph-bubble:#262626;--ph-text:#F5F5F5;--ph-mute:#A8A8A8;--ph-link:#E0F1FF;--frame:#27272A;color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#09090B;--surface:#121214;--sunk:#1F1F23;--line:#27272A;--line-2:#3F3F46;
  --ink:#FAFAFA;--ink-2:#A1A1AA;--ink-3:#8A8A94;--ph:#71717A;
  --accent:#3B8EF5;--on-accent:#0B0B0D;--btn:#FAFAFA;--on-btn:#09090B;--accent-soft:rgba(59,142,245,.22);
  --ok:#22C55E;--warn:#F59E0B;--bad:#EF4444;--warn-t:#F59E0B;--sw-off:#3F3F46;
  --shadow:0 8px 24px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);
  --ph-bg:#000;--ph-bubble:#262626;--ph-text:#F5F5F5;--ph-mute:#A8A8A8;--ph-link:#E0F1FF;--frame:#27272A;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,time{font-variant-numeric:tabular-nums}
.mute{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:500;white-space:nowrap;transition:background .15s ease-out,border-color .15s ease-out}
.btn:hover{background:var(--sunk)}
.sht{display:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.btn.primary:hover{background:var(--btn);opacity:.88}
.btn.solid-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.solid-bad:hover{background:var(--bad);opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--sunk)}
.btn.sm{min-height:28px;padding:0 10px;font-size:13px}
.btn.icon{padding:0;width:32px}
kbd{font:500 11px/1 var(--sans);padding:3px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;background:var(--sunk);color:var(--ink-2)}
.field{display:grid;gap:6px;margin-bottom:20px}
.field>label,.lbl{font-weight:500;font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl .mute,.field>label .mute{font-weight:400;font-size:12px}
.in{width:100%;min-height:36px;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.in::placeholder,.tags input::placeholder{color:var(--ph);opacity:1}
.in:hover{border-color:var(--ink-3)}
.in:focus,.tags:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:96px;line-height:1.5}
.in.kw{text-transform:uppercase;letter-spacing:.02em;font-weight:500}
.help{font-size:12px;color:var(--ink-3)}
.err{font-size:12px;color:var(--bad)}
.count{font-size:12px;font-weight:400;color:var(--ink-3);font-variant-numeric:tabular-nums}
.count.over{color:var(--bad)}
.tok{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--sunk);font:500 12px/1.6 var(--mono);letter-spacing:.02em;color:var(--ink)}
.tok.alias{background:transparent;color:var(--ink-2);font-weight:400}
.cid{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:6px;background:var(--sunk);color:var(--ink-3);padding:1px 6px;font:400 11.5px/1.6 var(--mono);opacity:0;transition:opacity .15s ease-out;cursor:pointer}
.cid:hover{color:var(--ink);border-color:var(--ink-3)}
.act:hover .cid,.cid:focus-visible{opacity:1}
.tok button{border:0;background:none;padding:0 0 0 2px;color:var(--ink-3);display:inline-flex}
.tok button:hover{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:36px;padding:4px 6px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.tags input{flex:1;min-width:120px;border:0;background:none;padding:4px;font-family:var(--sans);text-transform:uppercase;font-size:13px}
.tags input:focus-visible{outline:none}
.seg{display:inline-flex;position:relative;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{padding:5px 14px;border-radius:6px;font-weight:500;font-size:13px;color:var(--ink-2);cursor:pointer;min-height:28px;display:inline-flex;align-items:center;transition:background .15s,color .15s}
.seg input:checked+label{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line-2)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}
.sw{position:relative;width:32px;height:20px;border-radius:10px;border:0;padding:0;background:var(--sw-off);flex:none;transition:background .15s ease-out}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s ease-out;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true] i{transform:translateX(12px)}
.sw::after{content:"";position:absolute;inset:-10px -6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center;gap:28px}
.mark{display:flex;align-items:center;gap:9px;font:600 15px var(--sans);letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.logo{width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.logo svg{width:12px;height:12px;fill:currentColor;stroke:none}
.tabs{display:flex;gap:4px;height:100%}
.tabs a{display:flex;align-items:center;padding:0 10px;color:var(--ink-2);text-decoration:none;font-weight:500;position:relative;transition:color .15s}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current=page]{color:var(--ink)}
.tabs a[aria-current=page]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:16px}
.health{display:inline-flex;align-items:center;gap:8px;line-height:1;font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap;max-width:240px}
.health span:last-child{overflow:hidden;text-overflow:ellipsis}
.acct{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.acct span{line-height:1}
.av{width:22px;height:22px;border-radius:50%;background:var(--sunk);object-fit:cover;flex:none;display:inline-grid;place-items:center;font:500 11px var(--sans);color:var(--ink-2);border:1px solid var(--line)}
.btab{display:none}
main{max-width:960px;margin:0 auto;padding:32px 24px 96px}
.banners{max-width:960px;margin:0 auto;padding:0 24px}
.banner{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-top:16px;padding:12px 16px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;background:var(--surface)}
.banner.bad{border-left-color:var(--bad)}
.banner.info{border-left-color:var(--ink-3)}
.banner strong{font-weight:600}
.banner ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.banner li .mute{display:block}
.banner .acts{display:flex;gap:8px;flex:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.sub{color:var(--ink-3);margin-top:2px;font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:24px;overflow:hidden}
.stat{padding:16px 20px}
.stat+.stat{border-left:1px solid var(--line)}
.stat .k{font-size:12px;font-weight:500;color:var(--ink-2)}
.stat .v{font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v.bad{color:var(--bad)}
.stat .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.stat a,.link{color:var(--accent);text-decoration:none}
.stat a:hover,.link:hover{text-decoration:underline;text-underline-offset:3px}

/* automation rows */
.rows{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:16px 32px minmax(0,1fr) auto;gap:0 12px;padding:16px 16px 16px 10px;border-bottom:1px solid var(--line);position:relative;align-items:start}
.row:last-child{border-bottom:0}
@media (hover:hover){.row{cursor:pointer}.row:hover{background:var(--sunk)}}
.row.dragging{opacity:.4}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:1}
.row.drop-before::before{top:-1px}.row.drop-after::after{bottom:-1px}
.grip{display:flex;align-items:flex-start;justify-content:center;padding-top:3px;height:24px;color:var(--ink-3);cursor:grab;opacity:0;transition:opacity .15s}
.row:hover .grip{opacity:1}
.grip svg{fill:currentColor;stroke:none;width:14px;height:14px}
.rname{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:24px}
.rname a{font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.toks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.rdm{margin-top:8px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:620px}
.rmeta{margin-top:8px;display:flex;gap:2px 14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-3)}
.rmeta .bad{color:var(--bad)}
.rmeta .warn{color:var(--warn-t)}
.wait{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--warn-t);font-weight:500;font-size:13px}
.wait:hover{text-decoration:underline;text-underline-offset:3px}
.rside{display:flex;align-items:flex-start;gap:12px}
.rside .btn,.rside .more{opacity:0;transition:opacity .15s}
.row:hover .rside .btn,.row:hover .rside .more,.rside .btn:focus-visible,.rside .more:focus-visible,.rside .more[aria-expanded=true]{opacity:1}
.rside{align-items:center}
.menu{position:fixed;z-index:60;min-width:168px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;min-height:32px}
.menu button:hover,.menu button:focus-visible{background:var(--sunk);outline:none}
.menu button.danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.row.off .rname a,.row.off .rdm{color:var(--ink-3)}
.empty{padding:40px 24px;max-width:520px}
.empty h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.empty p{color:var(--ink-2);margin:6px 0 16px}

/* skeleton */
.sk{border-radius:8px;background:var(--sunk)}

/* posts */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:24px 16px}
.pc{display:flex;flex-direction:column;gap:8px;min-width:0;}
.pt{position:relative;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt .ph-none,.thumb-none{width:100%;height:100%;display:grid;place-items:center;color:var(--ink-3);font:12px var(--sans);background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 8px,var(--line) 8px,var(--line) 9px)}
.tag{position:absolute;top:8px;left:8px;padding:1px 6px;border-radius:6px;font:500 11px/1.6 var(--sans);background:var(--ink);color:var(--bg);letter-spacing:.02em}
.ext{position:absolute;top:6px;right:6px;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:rgba(18,17,16,.62);color:#fff;opacity:0;transition:opacity .15s}
.pt:hover .ext,.tile:hover .ext,.ext:focus-visible{opacity:1}
.pmeta{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12.5px}
.pmeta span{display:inline-flex;align-items:center;gap:5px}
.pcap{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchips{display:flex;gap:4px;flex-wrap:wrap;min-height:22px;align-items:center}
.pchips a{text-decoration:none}
.more{display:flex;justify-content:flex-start;margin-top:32px}

/* activity */
.filters{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.filters button{border:0;background:none;padding:8px 10px;color:var(--ink-2);font-weight:500;position:relative;min-height:36px}
.filters button[aria-pressed=true]{color:var(--ink)}
.filters button[aria-pressed=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:1.5px;background:var(--ink)}
.filters .c{font-size:12px;color:var(--ink-3);margin-left:5px}
.uu{display:grid;min-width:0;line-height:1.35}
.act .tm time{white-space:nowrap}
.act{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr) minmax(0,1.3fr) 168px 96px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.act.hd{padding:6px 0;font-size:12px;font-weight:500;color:var(--ink-3)}
.act .u{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.act .a{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.act .a>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .tm{text-align:right;font-size:12px;color:var(--ink-3);display:flex;justify-content:flex-end;align-items:center;gap:6px}
.src{font-size:12px;color:var(--ink-3)}
.live{font-size:12px;color:var(--ink-3)}

/* settings */
.sec{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:0}
.sec h2{font-size:15px;font-weight:600}
.sec .d{color:var(--ink-3);font-size:13px;margin-top:4px}
.line{display:flex;justify-content:space-between;align-items:center;gap:16px}
.chk-list{display:grid;gap:0;margin:0;padding:0;list-style:none}
.chk-list li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.chk-list li:last-child{border:0}
.chk-list .ic{width:16px;flex:none;align-self:center}
.ok-c{color:var(--ok)}.bad-c{color:var(--bad)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr}
.steps li::before{content:counter(s) ".";font-size:14px;color:var(--ink-3)}
.kl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;align-items:center}
.kl dt{display:flex;gap:4px}.kl dd{margin:0;color:var(--ink-2)}

/* layers */
.layer{position:fixed;inset:0;z-index:50;background:transparent;transition:background .2s ease-out}
.layer.in{background:var(--scrim)}
.layer.center{display:grid;place-items:center;padding:16px}
.modal{width:min(480px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:24px;opacity:0;transform:translateY(8px);transition:opacity .15s ease-out,transform .15s ease-out}
.modal.wide{width:min(560px,100%)}
.layer.in .modal{opacity:1;transform:none}
.modal h2{font-size:15px;font-weight:600}
.modal p{color:var(--ink-2);margin-top:8px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.wlist{margin:16px 0 0;border:1px solid var(--line);border-radius:6px;max-height:300px;overflow:auto}
.wi{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start;cursor:pointer;min-height:44px}
.wi:last-child{border:0}
.wi .u{font-weight:500;font-size:13px}.wi .t{color:var(--ink-2);overflow-wrap:anywhere}
.wi input,.chkrow input{accent-color:var(--accent);width:16px;height:16px;margin:3px 0 0}
.chkrow{display:flex;gap:10px;align-items:center;font-weight:500;padding:0 0 12px}
